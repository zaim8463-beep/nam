
name: Build TouchAssist APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "nam.zip"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP file
        run: |
          test -f nam.zip || {
            echo "ERROR: nam.zip not found in repository root"
            exit 1
          }
          unzip -t nam.zip

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q nam.zip -d extracted

          PROJECT_DIR="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No settings.gradle(.kts) found inside nam.zip"
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found"
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android build packages
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchAssist-ARM64-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
